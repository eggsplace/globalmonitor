<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Crisis Monitor — Tactical Ops</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Tactical Monospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a0c10;
            --bg-panel: rgba(14, 18, 24, 0.92);
            --border: #1e2638;
            --accent-cyan: #00f0ff;
            --accent-red: #ff3344;
            --accent-amber: #ffaa00;
            --accent-green: #00ff66;
            --text-main: #c0caf5;
            --text-dim: #565f89;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: #05070a;
            border-bottom: 1px solid var(--border);
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 2px;
            letter-spacing: 1px;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Breaking Marquee */
        .ticker-bar {
            background: rgba(255, 51, 68, 0.1);
            border-bottom: 1px solid rgba(255, 51, 68, 0.3);
            color: #ff8899;
            font-size: 12px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .ticker-bar span.label {
            color: var(--accent-red);
            font-weight: bold;
            margin-right: 12px;
        }

        /* Main Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            height: calc(100vh - 65px);
        }

        #map {
            flex: 1;
            height: 100%;
            background: #000;
        }

        /* Tactical Sidebar */
        aside {
            width: 380px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 999;
            backdrop-filter: blur(8px);
        }

        .sidebar-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
        }

        .filter-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }

        .filter-btn.active, .filter-btn:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        .events-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-cyan);
            padding: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .event-card:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--accent-cyan);
        }

        .event-card.critical {
            border-left-color: var(--accent-red);
        }

        .event-card.warning {
            border-left-color: var(--accent-amber);
        }

        .event-time {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Map UI Pulsing Markers */
        .pulse-marker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulse 1.5s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <span class="status-badge">● LIVE OPS</span>
            <span style="font-weight: bold; letter-spacing: 1px;">CRISIS MONITOR // TACTICAL</span>
        </div>
        <div class="top-controls">
            <span id="utc-clock">00:00:00 UTC</span>
            <span style="color: var(--text-dim);">FEEDS: <span id="feed-count" style="color: var(--accent-green);">SYNCING</span></span>
        </div>
    </header>

    <!-- Breaking News Ticker -->
    <div class="ticker-bar">
        <span class="label">BREAKING ❯❯</span>
        <marquee scrollamount="5" id="news-marquee">Monitoring seismic activity, wildfire zones, and regional events in real-time...</marquee>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <div id="map"></div>

        <aside>
            <div class="sidebar-header">
                <span>EVENT FEED</span>
                <span id="total-events-count" style="color: var(--accent-cyan);">0 ACTIVE</span>
            </div>
            <div class="filter-tabs">
                <button class="filter-btn active" onclick="filterEvents('all')">ALL</button>
                <button class="filter-btn" onclick="filterEvents('seismic')">SEISMIC</button>
                <button class="filter-btn" onclick="filterEvents('conflict')">INTEL</button>
            </div>
            <div class="events-list" id="events-feed">
                <div style="padding: 12px; color: var(--text-dim); text-align: center;">Fetching telemetry data...</div>
            </div>
        </aside>
    </div>

    <script>
        // 1. Clock Tracker
        function updateClock() {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Initialize Tactical Map
        const map = L.map('map', {
            center: [20, 0],
            zoom: 3,
            zoomControl: false
        });

        // Use CartoDB Dark Matter for the tactical dark theme
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO, OpenStreetMap contributors',
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let eventMarkers = [];
        let allEvents = [];

        // 3. Fetch Live Earthquakes (USGS GeoJSON)
        async function fetchSeismicData() {
            try {
                const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
                const data = await res.json();
                
                return data.features.map(f => ({
                    id: f.id,
                    type: 'seismic',
                    title: `M ${f.properties.mag} - ${f.properties.place}`,
                    mag: f.properties.mag,
                    coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
                    time: new Date(f.properties.time).toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
                    severity: f.properties.mag >= 6.0 ? 'critical' : 'warning'
                }));
            } catch (err) {
                console.error("Failed to load USGS feed:", err);
                return [];
            }
        }

        // 4. Render Markers & Feed Items
        function renderEvents(events) {
            // Clear existing markers
            eventMarkers.forEach(m => map.removeLayer(m));
            eventMarkers = [];

            const feedContainer = document.getElementById('events-feed');
            feedContainer.innerHTML = '';
            document.getElementById('total-events-count').innerText = `${events.length} EVENTS`;

            events.forEach(evt => {
                // Tactical Marker
                const marker = L.circleMarker(evt.coords, {
                    radius: evt.mag ? Math.max(evt.mag * 2, 6) : 6,
                    fillColor: evt.severity === 'critical' ? '#ff3344' : '#ffaa00',
                    color: '#fff',
                    weight: 1,
                    opacity: 0.8,
                    fillOpacity: 0.6
                }).addTo(map);

                marker.bindPopup(`<b>${evt.title}</b><br>Time: ${evt.time}`);
                eventMarkers.push(marker);

                // Sidebar Card
                const card = document.createElement('div');
                card.className = `event-card ${evt.severity}`;
                card.innerHTML = `
                    <div><strong>${evt.title}</strong></div>
                    <div class="event-time">${evt.time}</div>
                `;
                card.onclick = () => {
                    map.flyTo(evt.coords, 6, { duration: 1.5 });
                    marker.openPopup();
                };
                feedContainer.appendChild(card);
            });
        }

        // Filter Handlers
        window.filterEvents = function(type) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderEvents(allEvents);
            } else {
                renderEvents(allEvents.filter(e => e.type === type));
            }
        };

        // Initialize Feeds
        async function init() {
            const seismic = await fetchSeismicData();
            allEvents = [...seismic];
            renderEvents(allEvents);
            document.getElementById('feed-count').innerText = 'ONLINE';
        }

        init();
        // Auto refresh every 2 minutes
        setInterval(init, 120000);
    </script>
</body>
</html>
